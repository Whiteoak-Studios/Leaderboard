[package]
name = "fadeluc-123/leaderboard"
description = "Time-windowed global leaderboards for Roblox servers over MemoryStore and OrderedDataStore"
version = "1.5.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "server"
license = "Apache-2.0"
authors = ["Michael Sumner <mike@whiteoak.studio>"]
homepage = "https://github.com/Whiteoak-Studios/Leaderboard"
repository = "https://github.com/Whiteoak-Studios/Leaderboard"

exclude = ["**"]
include = ["src", "src/**", "default.project.json", "wally.toml", "README.md", "LICENSE", "NOTICE"]

[dependencies]
Promise = "evaera/promise@4.0.0"
Signal = "sleitnick/signal@2.0.3"
